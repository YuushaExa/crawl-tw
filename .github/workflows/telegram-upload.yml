name: Download, Unzip and Upload EPUBs to Telegram

on:
  workflow_dispatch:
    inputs:
      file_url:
        description: 'Direct URL to the ZIP file'
        required: true
        type: string

jobs:
  process-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Install Image Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: Download ZIP File
        env:
          FILE_URL: ${{ inputs.file_url }}
        run: |
          echo "Downloading from: $FILE_URL"
          curl -fLO "$FILE_URL"

      - name: Unzip File
        run: |
          for zip in *.zip; do
            if [ -f "$zip" ]; then
              echo "Extracting $zip"
              unzip -o "$zip"
              rm "$zip"
            fi
          done

      - name: Upload EPUB Files to Telegram
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          # Disable exit-on-error so we can handle curl failures
          set +e
          set -o pipefail
          
          echo "Starting EPUB upload to Telegram..."
          
          RATE_LIMIT_DELAY=2
          UPLOAD_TEMP_DIR="/tmp/telegram_upload_$$"
          EPUB_EXTRACT_DIR="/tmp/epub_extract_$$"
          MAX_FILE_SIZE=52428800
          MAX_THUMB_SIZE=204800
          
          mkdir -p "$UPLOAD_TEMP_DIR"
          mkdir -p "$EPUB_EXTRACT_DIR"
          
          total_files=0
          uploaded_files=0
          skipped_size_files=0
          skipped_error_files=0
          files_with_thumb=0
          files_without_thumb=0
          file_counter=0
          
          echo "📋 EPUB Upload Log - $(date '+%Y-%m-%d %H:%M:%S')" > upload_log.txt
          echo "==========================================" >> upload_log.txt
          
          # Function to sanitize filename (remove/replace special chars)
          sanitize_filename() {
            local name="$1"
            printf '%s' "$name" | sed 's/[^a-zA-Z0-9._-]/_/g'
          }
          
          # Function to remove .epub extension for display
          get_display_name() {
            local name="$1"
            # Remove .epub extension (case-insensitive)
            printf '%s' "$name" | sed 's/\.[eE][pP][uU][bB]$//'
          }
          
          # Function to find cover image inside EPUB (OEBPS folder)
          find_cover_in_epub() {
            local epub_path="$1"
            local epub_name=$(basename "$epub_path" .epub)
            local extract_dir="${EPUB_EXTRACT_DIR}/epub_${file_counter}"
            
            mkdir -p "$extract_dir"
            
            unzip -q -o "$epub_path" -d "$extract_dir" 2>/dev/null
            if [ $? -ne 0 ]; then
              echo ""
              return 1
            fi
            
            local cover_extensions=("jpg" "jpeg" "png")
            local search_paths=(
              "OEBPS"
              "OEBPS/images"
              "OEBPS/Images"
              "OEBPS/img"
              "OEBPS/Img"
              "OEBPS/media"
              "OEBPS/Media"
              "EPUB"
              "EPUB/images"
              "."
            )
            
            local cover_names=(
              "cover"
              "Cover"
              "COVER"
              "cover_image"
              "cover-image"
              "frontcover"
              "front-cover"
              "folder"
              "${epub_name}"
            )
            
            for base_path in "${search_paths[@]}"; do
              for ext in "${cover_extensions[@]}"; do
                for name in "${cover_names[@]}"; do
                  local potential_cover="${extract_dir}/${base_path}/${name}.${ext}"
                  if [ -f "$potential_cover" ]; then
                    echo "$potential_cover"
                    return 0
                  fi
                done
              done
            done
            
            for base_path in "${search_paths[@]}"; do
              local found=$(find "$extract_dir/${base_path}" -maxdepth 2 -type f \( -iname "*cover*.jpg" -o -iname "*cover*.jpeg" -o -iname "*cover*.png" \) 2>/dev/null | head -1)
              if [ -n "$found" ]; then
                echo "$found"
                return 0
              fi
            done
            
            for base_path in "${search_paths[@]}"; do
              local found=$(find "$extract_dir/${base_path}" -maxdepth 2 -type f \( -iname "*.jpg" -o -iname "*.jpeg" -o -iname "*.png" \) 2>/dev/null | head -1)
              if [ -n "$found" ]; then
                echo "$found"
                return 0
              fi
            done
            
            echo ""
            return 1
          }
          
          # Function to prepare thumbnail
          prepare_thumbnail() {
            local src="$1"
            local dst="$2"
            
            if ! command -v convert &> /dev/null; then
              cp -- "$src" "$dst"
              return 0
            fi
            
            local dimensions=$(identify -format "%wx%h" "$src" 2>/dev/null)
            if [ -z "$dimensions" ]; then
              cp -- "$src" "$dst"
              return 0
            fi
            
            convert "$src" -resize "320x320>" -quality 85 "$dst" 2>/dev/null
            if [ $? -ne 0 ]; then
              cp -- "$src" "$dst"
            fi
            
            local thumb_size=$(stat -c%s "$dst" 2>/dev/null || stat -f%z "$dst" 2>/dev/null)
            if [ "$thumb_size" -gt "$MAX_THUMB_SIZE" ]; then
              convert "$dst" -quality 70 "$dst" 2>/dev/null
            fi
            
            return 0
          }
          
          while IFS= read -r -d '' file; do
            total_files=$((total_files + 1))
            file_counter=$((file_counter + 1))
            filename=$(basename "$file")
            
            # Get display name (without .epub extension)
            display_name=$(get_display_name "$filename")
            
            file_size=$(stat -c%s "$file" 2>/dev/null || stat -f%z "$file" 2>/dev/null)
            size_mb=$(awk "BEGIN {printf \"%.2f\", $file_size/1048576}")
            
            echo "=========================================="
            echo "File: $display_name"
            echo "Size: ${size_mb} MB ($file_size bytes)"
            
            if [ "$file_size" -gt "$MAX_FILE_SIZE" ]; then
              echo "⚠ SKIPPED (SIZE): $display_name exceeds 50MB limit"
              echo "📝 $(date '+%Y-%m-%d %H:%M:%S') - SKIPPED (SIZE) - $display_name - ${size_mb}MB" >> upload_log.txt
              skipped_size_files=$((skipped_size_files + 1))
              continue
            fi
            
            # Escape HTML for caption (using display name without .epub)
            caption=$(printf '%s' "$display_name" | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g; s/"/\&quot;/g')
            
            # Look for cover image inside EPUB
            cover_image=""
            thumb_file=""
            has_thumbnail=false
            
            cover_image=$(find_cover_in_epub "$file")
            if [ -n "$cover_image" ] && [ -f "$cover_image" ]; then
              echo "✓ Cover image found inside EPUB: $(basename "$cover_image")"
              thumb_file="${UPLOAD_TEMP_DIR}/thumb_${file_counter}.jpg"
              prepare_thumbnail "$cover_image" "$thumb_file"
              
              thumb_size=$(stat -c%s "$thumb_file" 2>/dev/null || stat -f%z "$thumb_file" 2>/dev/null)
              thumb_size_kb=$((thumb_size / 1024))
              echo "  Thumbnail size: ${thumb_size_kb}KB"
              
              if [ "$thumb_size" -le "$MAX_THUMB_SIZE" ]; then
                has_thumbnail=true
                files_with_thumb=$((files_with_thumb + 1))
              else
                echo "  ⚠ Thumbnail too large, skipping"
                files_without_thumb=$((files_without_thumb + 1))
              fi
            else
              echo "  → No cover image found in EPUB"
              files_without_thumb=$((files_without_thumb + 1))
            fi
            
            temp_file="${UPLOAD_TEMP_DIR}/upload_${file_counter}.epub"
            
            echo "Copying to temp: $temp_file"
            cp -- "$file" "$temp_file"
            copy_status=$?
            
            if [ $copy_status -ne 0 ]; then
              echo "✗ SKIPPED (COPY ERROR)"
              echo "📝 $(date '+%Y-%m-%d %H:%M:%S') - SKIPPED (COPY) - $display_name" >> upload_log.txt
              skipped_error_files=$((skipped_error_files + 1))
              continue
            fi
            
            if [ ! -f "$temp_file" ] || [ ! -r "$temp_file" ]; then
              echo "✗ SKIPPED: Temp file not readable"
              echo "📝 $(date '+%Y-%m-%d %H:%M:%S') - SKIPPED (NOT READABLE) - $display_name" >> upload_log.txt
              skipped_error_files=$((skipped_error_files + 1))
              continue
            fi
            
            temp_size=$(stat -c%s "$temp_file" 2>/dev/null || stat -f%z "$temp_file" 2>/dev/null)
            echo "Temp file size: $temp_size bytes"
            
            if [ "$temp_size" -eq 0 ]; then
              echo "✗ SKIPPED: Temp file is empty"
              echo "📝 $(date '+%Y-%m-%d %H:%M:%S') - SKIPPED (EMPTY) - $display_name" >> upload_log.txt
              skipped_error_files=$((skipped_error_files + 1))
              rm -f "$temp_file"
              continue
            fi
            
            max_retries=5
            retry_count=0
            upload_success=false
            filename_mode="original"
            
            while [ $retry_count -lt $max_retries ]; do
              echo "Uploading: $display_name (attempt $((retry_count + 1))/$max_retries)"
              
              if [ "$filename_mode" = "original" ]; then
                echo "  → Mode: Original filename"
                upload_filename="$filename"
              elif [ "$filename_mode" = "sanitized" ]; then
                echo "  → Mode: Sanitized filename"
                upload_filename=$(sanitize_filename "$filename")
              fi
              
              echo "  → Upload filename: $upload_filename"
              echo "  → Thumbnail: $([ "$has_thumbnail" = true ] && echo 'Yes' || echo 'No')"
              
              if [ "$has_thumbnail" = true ]; then
                response=$(curl -s -w "\nHTTP_CODE:%{http_code}" -X POST \
                  "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendDocument" \
                  --form "chat_id=${TG_CHAT_ID}" \
                  --form "document=@${temp_file};filename=${upload_filename}" \
                  --form "thumb=@${thumb_file}" \
                  --form "caption=${caption}" \
                  --form "parse_mode=HTML" || true)
              else
                response=$(curl -s -w "\nHTTP_CODE:%{http_code}" -X POST \
                  "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendDocument" \
                  --form "chat_id=${TG_CHAT_ID}" \
                  --form "document=@${temp_file};filename=${upload_filename}" \
                  --form "caption=${caption}" \
                  --form "parse_mode=HTML" || true)
              fi
              
              curl_exit_code=${PIPESTATUS[0]}
              
              http_code=$(echo "$response" | grep "HTTP_CODE:" | cut -d':' -f2)
              response_body=$(echo "$response" | sed '/HTTP_CODE:/d')
              
              echo "  → curl exit code: $curl_exit_code, HTTP: $http_code"
              
              if [ $curl_exit_code -ne 0 ]; then
                echo "  ⚠ curl failed: exit code $curl_exit_code"
                
                if [ "$filename_mode" = "original" ] && [ $curl_exit_code -eq 26 ]; then
                  echo "  → Switching to sanitized filename mode..."
                  filename_mode="sanitized"
                  retry_count=$((retry_count + 1))
                  continue
                fi
                
                retry_count=$((retry_count + 1))
                if [ $retry_count -lt $max_retries ]; then
                  echo "  → Retrying in 5s..."
                  sleep 5
                  continue
                else
                  echo "✗ SKIPPED (CURL): Exit $curl_exit_code after $max_retries attempts"
                  echo "📝 $(date '+%Y-%m-%d %H:%M:%S') - SKIPPED (CURL $curl_exit_code) - $display_name" >> upload_log.txt
                  skipped_error_files=$((skipped_error_files + 1))
                  break
                fi
              fi
              
              if echo "$response_body" | grep -q '"ok":true'; then
                if [ "$has_thumbnail" = true ]; then
                  thumb_status="With Thumbnail"
                else
                  thumb_status="No Thumbnail"
                fi
                
                if [ "$filename_mode" = "original" ]; then
                  echo "✓ Success: $display_name (original name, ${thumb_status})"
                  echo "📝 $(date '+%Y-%m-%d %H:%M:%S') - UPLOADED - $display_name - ${size_mb}MB - Original Name - ${thumb_status}" >> upload_log.txt
                else
                  echo "✓ Success: $display_name (sanitized: $upload_filename, ${thumb_status})"
                  echo "📝 $(date '+%Y-%m-%d %H:%M:%S') - UPLOADED - $display_name - ${size_mb}MB - Sanitized Name - ${thumb_status}" >> upload_log.txt
                fi
                uploaded_files=$((uploaded_files + 1))
                upload_success=true
                break
              elif echo "$response_body" | grep -q '"error_code":429'; then
                retry_after=$(echo "$response_body" | grep -o '"retry_after":[0-9]*' | grep -o '[0-9]*' || echo "30")
                [ -z "$retry_after" ] && retry_after=30
                retry_count=$((retry_count + 1))
                echo "⚠ Rate limited. Waiting ${retry_after}s..."
                sleep "$retry_after"
              else
                echo "✗ API error:"
                echo "$response_body"
                
                if [ "$filename_mode" = "original" ]; then
                  echo "  → Switching to sanitized filename mode..."
                  filename_mode="sanitized"
                  retry_count=$((retry_count + 1))
                  continue
                fi
                
                retry_count=$((retry_count + 1))
                if [ $retry_count -lt $max_retries ]; then
                  echo "  → Retrying in 5s..."
                  sleep 5
                  continue
                else
                  echo "✗ SKIPPED (API): After $max_retries attempts"
                  echo "📝 $(date '+%Y-%m-%d %H:%M:%S') - SKIPPED (API) - $display_name" >> upload_log.txt
                  skipped_error_files=$((skipped_error_files + 1))
                  break
                fi
              fi
            done
            
            if [ "$upload_success" = false ] && [ $retry_count -ge $max_retries ]; then
              echo "✗ SKIPPED (MAX RETRIES): $display_name"
              echo "📝 $(date '+%Y-%m-%d %H:%M:%S') - SKIPPED (RETRIES) - $display_name" >> upload_log.txt
              skipped_error_files=$((skipped_error_files + 1))
            fi
            
            rm -f "$temp_file"
            rm -f "$thumb_file"
            rm -rf "${EPUB_EXTRACT_DIR}/epub_${file_counter}"
            
            echo "Waiting ${RATE_LIMIT_DELAY}s..."
            sleep "$RATE_LIMIT_DELAY"
            
          done < <(find . -type f -iname '*.epub' -not -path '*/\.*' -print0)
          
          rm -rf "$UPLOAD_TEMP_DIR"
          rm -rf "$EPUB_EXTRACT_DIR"
          
          echo ""
          echo "=========================================="
          echo "📊 UPLOAD SUMMARY"
          echo "=========================================="
          echo "Total: $total_files"
          echo "✓ Uploaded: $uploaded_files"
          echo "  - With Thumbnail: $files_with_thumb"
          echo "  - Without Thumbnail: $files_without_thumb"
          echo "⚠ Skipped (Size): $skipped_size_files"
          echo "⚠ Skipped (Errors): $skipped_error_files"
          echo "=========================================="
          
          echo "" >> upload_log.txt
          echo "SUMMARY: Total=$total_files, Uploaded=$uploaded_files, With_Thumb=$files_with_thumb, Without_Thumb=$files_without_thumb, Skipped_Size=$skipped_size_files, Skipped_Errors=$skipped_error_files" >> upload_log.txt
          
          if [ "$skipped_size_files" -gt 0 ] || [ "$skipped_error_files" -gt 0 ]; then
            echo "📎 Uploading log to Telegram..."
            curl -s -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendDocument" \
              -F "chat_id=${TG_CHAT_ID}" \
              -F "document=@upload_log.txt" \
              -F "caption=📋 Upload Log" \
              -F "parse_mode=HTML" || true
          fi
          
          echo "✅ Workflow completed."
          exit 0
