name: Novel Crawler TG (Direct Upload)

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'URL to crawl'
        required: true

jobs:
  crawl-and-send:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      # We only need the code to run the script, no history needed
      with:
        fetch-depth: 1 
        
    - name: Clear results folder (optional cleanup)
      run: rm -rf results-tg || true

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        
    - name: Install dependencies
      run: npm install
      
    - name: Run crawler
      run: node script/script-tg.js "${{ github.event.inputs.url }}"
        
    - name: Upload result directly to Telegram
      env:
        TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
        TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
      run: |
        # Find the generated zip file
        FILE_PATH=$(find results-tg -name "*.zip" -type f | head -n 1)

        if [ -z "$FILE_PATH" ]; then
          echo "::error::No .zip file found in results-tg. Did the crawler fail?"
          exit 1
        fi

        echo "✅ Found file: $FILE_PATH"
        FILE_NAME=$(basename "$FILE_PATH")
        INPUT_URL="${{ github.event.inputs.url }}"

        # Send to Telegram
        echo "🚀 Uploading to Telegram channel..."
        curl -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendDocument" \
          -F "chat_id=${TG_CHAT_ID}" \
          -F "document=@${FILE_PATH}" \
          -F "caption=📚 ${FILE_NAME}" \
          -F "parse_mode=HTML"

        echo "✅ Upload successful!"
