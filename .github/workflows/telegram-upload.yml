name: Download, Unzip and Upload EPUBs to Telegram

on:
  workflow_dispatch:
    inputs:
      file_url:
        description: 'Direct URL to the ZIP file'
        required: true
        type: string

jobs:
  process-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Download ZIP File
        env:
          FILE_URL: ${{ inputs.file_url }}
        run: |
          echo "Downloading from: $FILE_URL"
          curl -fLO "$FILE_URL"

      - name: Unzip File
        run: |
          for zip in *.zip; do
            if [ -f "$zip" ]; then
              echo "Extracting $zip"
              unzip -o "$zip"
              rm "$zip"
            fi
          done

      - name: Upload EPUB Files to Telegram
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          echo "Starting EPUB upload to Telegram..."
          
          # Rate limit: seconds to wait between each file upload
          RATE_LIMIT_DELAY=2
          
          # Find only .epub files, null-separated for safety
          while IFS= read -r -d '' file; do
            filename=$(basename "$file")
            echo "Uploading: $filename"
            
            # Escape HTML-sensitive characters for caption (parse_mode=HTML)
            caption=$(printf '%s' "$filename" | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g; s/"/\&quot;/g')
            
            max_retries=5
            retry_count=0
            
            while [ $retry_count -lt $max_retries ]; do
              response=$(curl -s -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendDocument" \
                -F "chat_id=${TG_CHAT_ID}" \
                -F "document=@${file};filename=${filename}" \
                -F "caption=${caption}" \
                -F "parse_mode=HTML")
              
              if echo "$response" | grep -q '"ok":true'; then
                echo "✓ Success: $filename"
                break
              elif echo "$response" | grep -q '"error_code":429'; then
                # Extract retry_after from JSON response
                retry_after=$(echo "$response" | grep -o '"retry_after":[0-9]*' | grep -o '[0-9]*' || echo "30")
                if [ -z "$retry_after" ]; then
                  retry_after=30
                fi
                retry_count=$((retry_count + 1))
                echo "⚠ Rate limited. Waiting ${retry_after}s before retry ($retry_count/$max_retries)..."
                sleep "$retry_after"
              else
                echo "✗ Failed: $filename"
                echo "Response: $response"
                exit 1
              fi
            done
            
            if [ $retry_count -eq $max_retries ]; then
              echo "✗ Max retries reached for $filename"
              exit 1
            fi
            
            # Wait between successful uploads to avoid hitting rate limit
            echo "Waiting ${RATE_LIMIT_DELAY}s before next file..."
            sleep "$RATE_LIMIT_DELAY"
            
          done < <(find . -type f -iname '*.epub' -not -path '*/\.*' -print0)
          
          echo "✅ All EPUB files processed successfully."
