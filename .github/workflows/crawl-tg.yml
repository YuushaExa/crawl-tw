name: Novel Crawler TG

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'URL to crawl'
        required: true

jobs:
  crawl:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Needed to push changes back
        
    - name: Clear results folder
      run: rm -rf results-tg || true

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        
    - name: Install dependencies
      run: npm install
      
    - name: Run crawler
      run: node script/script-tg.js "${{ github.event.inputs.url }}"
      
    - name: Send to Telegram
      env:
        BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
        CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        URL: ${{ github.event.inputs.url }}
      run: |
        FILE=$(ls results-tg/*.zip 2>/dev/null | head -1)
        [ -z "$FILE" ] && echo "No zip found!" && exit 1
        curl -s -X POST "https://api.telegram.org/bot$BOT_TOKEN/sendDocument" \
          -F chat_id="$CHAT_ID" \
          -F document=@"$FILE" \
          -F caption="📚 Crawl Done%0A🔗 $URL%0A📄 $(basename $FILE)"
          
    - name: Commit and push results
      run: |
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        mkdir -p results-tg  # Ensure dir exists even if empty
        git add results-tg
        git commit -m "Updated novel crawl results" || echo "No changes to commit"
        git push
