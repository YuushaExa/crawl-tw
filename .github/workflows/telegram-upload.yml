name: Download, Unzip and Upload to Telegram

on:
  workflow_dispatch:
    inputs:
      file_url:
        description: 'Direct URL to the ZIP file'
        required: true
        type: string

jobs:
  process-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code (Optional)
        uses: actions/checkout@v3

      - name: Download ZIP File
        env:
          FILE_URL: ${{ inputs.file_url }}
        run: |
          echo "Downloading from: $FILE_URL"
          curl -fLO "$FILE_URL"

      - name: Unzip File
        run: |
          # Find the downloaded zip file and extract it
          for zip in *.zip; do
            if [ -f "$zip" ]; then
              echo "Extracting $zip"
              unzip -o "$zip"
              rm "$zip" # Clean up the zip to avoid uploading it
            fi
          done

      - name: Upload Files to Telegram
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          echo "Starting upload to Telegram..."
          
          # Find all files recursively, excluding hidden directories
          while IFS= read -r -d '' file; do
            filename=$(basename "$file")
            echo "Uploading: $filename"
            
            # Send Document API Endpoint
            # We use ;filename= to preserve the original filename in Telegram
            response=$(curl -s -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendDocument" \
              -F "chat_id=${TG_CHAT_ID}" \
              -F "document=@${file};filename=${filename}")
            
            # Check if upload was successful
            if echo "$response" | grep -q '"ok":true'; then
              echo "✓ Success: $filename"
            else
              echo "✗ Failed: $filename"
              echo "Response: $response"
              # Exit on failure (optional, remove 'exit 1' if you want to continue other files)
              exit 1 
            fi
          done < <(find . -type f -not -path '*/\.*' -print0)
          
          echo "All files processed."
